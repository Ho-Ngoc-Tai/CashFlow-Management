name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Docker Image & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Tags
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.target_env }}" == "production" ]]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "DOCKER_TAG=prod-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "DOCKER_TAG=staging-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image (and Push if Registry Credentials configured)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          load: ${{ secrets.DOCKER_USERNAME == '' || secrets.DOCKER_PASSWORD == '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'local' }}/flowsync-web:${{ steps.meta.outputs.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME || 'local' }}/flowsync-web:${{ steps.meta.outputs.ENV }}-latest

      - name: Deploy to VPS / Server via SSH
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/flowsync
            docker compose -f docker/docker-compose.${{ steps.meta.outputs.ENV }}.yml pull web
            docker compose -f docker/docker-compose.${{ steps.meta.outputs.ENV }}.yml up -d --remove-orphans
            docker system prune -f

      - name: Deployment Setup Notice (If Secrets Not Yet Configured)
        if: ${{ secrets.DOCKER_USERNAME == '' || secrets.SSH_HOST == '' }}
        shell: bash
        run: |
          echo "=========================================================================="
          echo "ℹ️  THÔNG BÁO QUẢN TRỊ CI/CD:"
          echo "Docker Image đã được build kiểm thử THÀNH CÔNG trong container!"
          echo "Để tự động push lên Docker Hub và deploy tự động lên VPS/Server:"
          echo "Vào GitHub Repo Settings -> Secrets and variables -> Actions và thêm:"
          echo "  - DOCKER_USERNAME, DOCKER_PASSWORD"
          echo "  - SSH_HOST, SSH_USER, SSH_PRIVATE_KEY"
          echo "=========================================================================="
