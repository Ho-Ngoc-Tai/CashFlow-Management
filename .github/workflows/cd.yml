name: Enterprise CD Pipeline

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Docker Image & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Tags
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.target_env }}" == "production" ]]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
            echo "DOCKER_TAG=prod-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
            echo "DOCKER_TAG=staging-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ steps.meta.outputs.ENV }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ steps.meta.outputs.ENV }}-

      - name: Log in to Container Registry
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ env.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'local' }}/flowsync-web:${{ steps.meta.outputs.DOCKER_TAG }}
            ${{ secrets.DOCKER_USERNAME || 'local' }}/flowsync-web:${{ steps.meta.outputs.ENV }}-latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      # Move cache to prevent unlimited disk growth
      - name: Move Docker cache
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Deploy to VPS / Staging Server via SSH
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /opt/flowsync
            docker compose -f docker/docker-compose.${{ steps.meta.outputs.ENV }}.yml pull web
            docker compose -f docker/docker-compose.${{ steps.meta.outputs.ENV }}.yml up -d --remove-orphans
            docker system prune -f
