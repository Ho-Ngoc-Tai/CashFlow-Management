services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cashflow_web_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2048M
